[".config/zsh/plugins/fast-syntax-highlighting"]
    type = "archive"
    url = "https://github.com/zdharma-continuum/fast-syntax-highlighting/archive/HEAD.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".config/zsh/plugins/zsh-shift-select"]
    type = "archive"
    url = "https://github.com/jirutka/zsh-shift-select/archive/HEAD.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".tmux/plugins/tpm"]
    type = "git-repo"            # tpm updates itself via git
    url = "https://github.com/tmux-plugins/tpm.git"

[".local/lib/shell-lib"]
    type = "git-repo"            # your own repo: you can commit from inside it
    url = "https://github.com/colemcanelly/shell-lib.git"
    refreshPeriod = "24h"